<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resposta enviada — Maxfio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f4f6f4; color: #1a1a1a; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .card { background: #fff; border: 1px solid #dde8e3; border-top: 4px solid #1D9E75; border-radius: 12px; padding: 3rem 2.5rem; max-width: 480px; text-align: center; }
    .icon { font-size: 56px; margin-bottom: 1rem; display: block; }
    h2 { font-size: 22px; font-weight: 600; color: #0F6E56; margin-bottom: 0.6rem; }
    p { font-size: 14px; color: #555; line-height: 1.7; }
    a { display: inline-block; margin-top: 1.5rem; color: #1D9E75; font-size: 14px; text-decoration: none; font-weight: 500; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <span class="icon">&#9989;</span>
    <h2>Obrigado pela sua participação!</h2>
    <p>Suas respostas foram registradas com <strong>total confidencialidade</strong>.<br>Sua contribuição é fundamental para melhorarmos o ambiente de trabalho na Maxfio.</p>
    <a href="/">&#8592; Voltar ao início</a>
  </div>
</body>
</html>
